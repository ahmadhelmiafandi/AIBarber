name: Staging Scheduled Cron Trigger

on:
  schedule:
    # Trigger every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Staging Cleanup Endpoint
        env:
          STAGING_URL: ${{ secrets.STAGING_API_URL }}
          CRON_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
        run: |
          API_URL="${STAGING_URL:-https://api.mybarber.my.id}"
          curl -X POST "$API_URL/api/v1/cron/cleanup" \
            -H "X-Cron-Token: $CRON_TOKEN" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error || echo "Cron endpoint trigger completed"
