name: Deploy Staging

on:
  push:
    branches: [main, staging]

jobs:
  verify:
    name: Pre-Deployment Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aibarber_test
          POSTGRES_USER: aibarber
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, gd, redis
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress

      - name: Run Backend Tests
        env:
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: |
          cd backend
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Production Build
        run: |
          cd frontend
          npm run build

  deploy-backend:
    name: Deploy Backend to Render
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --fail --silent --show-error

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  post-deploy:
    name: Post-Deployment Health Verification
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render to Boot
        run: sleep 30

      - name: Healthcheck Backend API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_API_URL }}/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "HEALTH CHECK FAILED: HTTP $STATUS"
            exit 1
          fi
          echo "HEALTH CHECK PASSED: HTTP $STATUS"

      - name: Healthcheck Frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_FRONTEND_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "FRONTEND CHECK FAILED: HTTP $STATUS"
            exit 1
          fi
          echo "FRONTEND CHECK PASSED: HTTP $STATUS"
